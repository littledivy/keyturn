<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotterdam housing dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ground:#eef1f2;--surface:#fff;--ink:#152229;--muted:#5c6a71;
    --accent:#1f6f7a;--accent-ink:#164e56;--good:#2f7d4f;--line:#d9e0e2;
    --centrum:#c0392b;--noord:#1f6f7a;--west:#8e5cc0;--oost:#2f7d4f;--zuid:#c77d13;
    --shadow:0 1px 2px rgba(21,34,41,.06),0 6px 18px rgba(21,34,41,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;z-index:500}
  .brand{display:flex;flex-direction:column}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
  h1{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:750}
  .sub{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  button,select{font:inherit}
  .chip{font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{font-size:13px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{background:var(--accent-ink)}
  .btn.ghost{background:var(--surface);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  select{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
  main{flex:1;display:grid;grid-template-columns:minmax(360px,44%) 1fr;min-height:0}
  #list{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  #map{height:100%}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;gap:0;flex-shrink:0;transition:transform .12s,box-shadow .12s;cursor:pointer}
  .card:hover,.card.hi{transform:translateY(-2px);box-shadow:0 2px 4px rgba(21,34,41,.08),0 14px 30px rgba(21,34,41,.13)}
  .card.done{opacity:.5}
  .card.done .ctitle,.card.done .price{text-decoration:line-through}
  .appliedtag{font-size:9.5px;letter-spacing:.07em;font-weight:800;color:#fff;background:var(--muted);padding:2px 6px;border-radius:5px}
  .thumb{width:132px;flex:none;aspect-ratio:1;background:#ccd4d6 center/cover no-repeat}
  .cbody{padding:11px 13px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .cprice{display:flex;align-items:baseline;gap:8px}
  .price{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
  .ppm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ppm.good{color:var(--good);font-weight:600}
  .newpill{font-size:9.5px;letter-spacing:.07em;font-weight:800;color:#fff;background:var(--good);padding:2px 6px;border-radius:5px}
  .ctitle{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;font-variant-numeric:tabular-nums}
  .badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}
  .row{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
  .row a{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600}
  .row a:hover{text-decoration:underline}
  .mini{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
  .mini.apply{border-color:var(--good);color:var(--good)}
  .detail{font-size:12px;color:var(--muted);background:#f4f7f7;border-radius:8px;padding:8px 10px;margin-top:2px;display:none}
  .detail.show{display:block}
  .detail b{color:var(--ink)}
  .leaflet-popup-content{margin:10px 12px;font-family:inherit}
  .pop img{width:100%;border-radius:6px;margin-bottom:6px}
  .pop .pp{font-weight:750;font-size:15px}
  .pop a{color:var(--accent);font-weight:600;text-decoration:none}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(21,34,41,.45);display:none;align-items:center;justify-content:center;z-index:1000}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border-radius:14px;padding:22px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 4px}
  .modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .modal textarea{width:100%;min-height:150px;font:inherit;font-size:13.5px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:1100;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="eyebrow">Pararius · live · €1000+ · no shared rooms</span>
    <h1>Rotterdam housing dashboard</h1>
    <span class="sub" id="sub">loading…</span>
  </div>
  <span class="spacer"></span>
  <div class="controls">
    <button class="chip" data-d="all" aria-pressed="true">All</button>
    <button class="chip" data-d="centrum" aria-pressed="false">Centrum</button>
    <button class="chip" data-d="noord" aria-pressed="false">Noord</button>
    <button class="chip" data-d="west" aria-pressed="false">West</button>
    <button class="chip" data-d="oost" aria-pressed="false">Oost</button>
    <button class="chip" data-d="zuid" aria-pressed="false">Zuid</button>
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="ppm">Best value (€/m²)</option>
      <option value="price">Price ↑</option>
      <option value="price-d">Price ↓</option>
      <option value="area-d">Size ↓</option>
    </select>
    <button class="btn" id="scrape">Scrape now</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle">Apply</h3>
    <p id="mSub"></p>
    <textarea id="mMsg"></textarea>
    <div class="actions">
      <label style="font-size:12px;color:var(--muted);margin-right:auto"><input type="checkbox" id="mDry"> dry run (fill, don't send)</label>
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn" id="mSend">Send application</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DCOLOR={centrum:"#c0392b",noord:"#1f6f7a",west:"#8e5cc0",oost:"#2f7d4f",zuid:"#c77d13"};
const state={all:[],district:"all",sort:"new"};
let map,markers={};

const DEFAULT_MSG=`Hello,

My name is [your name] and I work full-time. I am looking for a comfortable long-term home in a well-connected residential area.

I meet the income requirement and can provide my documents and identification immediately.

I have a quiet and responsible lifestyle. If needed, someone local can attend the viewing on my behalf, and I can join by video call.

Kind regards,
[your name]`;

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200);}

function initMap(){
  map=L.map("map",{scrollWheelZoom:true}).setView([51.921,4.472],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
}

function visible(){
  let l=state.all.filter(c=>state.district==="all"||c.district===state.district);
  const s=state.sort;
  if(s==="new") l.sort((a,b)=>(b.is_new?1:0)-(a.is_new?1:0)||(a.ppm||1e9)-(b.ppm||1e9));
  else l.sort((a,b)=>s==="ppm"?(a.ppm||1e9)-(b.ppm||1e9):s==="price"?a.price-b.price:s==="price-d"?b.price-a.price:b.area-a.area);
  l.sort((a,b)=>(a.contacted?1:0)-(b.contacted?1:0));  // applied listings sink to the bottom
  return l;
}

function render(){
  const list=document.getElementById("list");list.innerHTML="";
  Object.values(markers).forEach(m=>map.removeLayer(m));markers={};
  const items=visible();
  const ppms=items.map(c=>c.ppm).filter(Boolean).sort((a,b)=>a-b);
  const med=ppms.length?ppms[Math.floor(ppms.length/2)]:0;
  const prices=items.map(c=>c.price);
  const applied=items.filter(c=>c.contacted).length;
  document.getElementById("sub").textContent=
    `${items.length-applied} open${applied?` · ${applied} applied`:""} · €${Math.min(...prices)}–€${Math.max(...prices)}/mo`;
  const bounds=[];

  items.forEach(c=>{
    const good=c.ppm&&med&&c.ppm<=med*0.9;
    const card=el("div","card"+(c.contacted?" done":""));
    card.dataset.url=c.url;
    const img=c.image?`/img?u=${encodeURIComponent(c.image)}`:"";
    card.innerHTML=`
      <div class="thumb" style="background-image:url('${img}')"></div>
      <div class="cbody">
        <div class="cprice"><span class="price">€${c.price.toLocaleString()}</span>
          <span class="ppm ${good?'good':''}">€${c.ppm}/m²${good?' · good value':''}</span>
          ${c.is_new&&!c.contacted?'<span class="newpill">NEW</span>':''}
          ${c.contacted?'<span class="appliedtag">APPLIED</span>':''}
          <span class="spacer"></span>
          <span class="badge" style="background:${DCOLOR[c.district]||'#555'}">${c.district||''}</span></div>
        <div class="ctitle">${c.title}</div>
        <div class="meta"><span>${c.area} m²</span>${c.beds!=null?`<span>${c.beds} bed</span>`:""}${c.interior?`<span>${c.interior.toLowerCase()}</span>`:""}<span>${c.kind}</span></div>
        <div class="detail"></div>
        <div class="row">
          <a href="${c.url}" target="_blank" rel="noopener">Pararius ↗</a>
          <button class="mini det">Details</button>
          <span class="spacer"></span>
          <button class="mini apply">${c.contacted?'✓ Applied':'Apply'}</button>
        </div>
      </div>`;
    list.appendChild(card);

    card.querySelector(".det").onclick=e=>{e.stopPropagation();loadDetail(c,card);};
    card.querySelector(".apply").onclick=e=>{e.stopPropagation();if(!c.contacted)openApply(c);};
    card.onmouseenter=()=>markers[c.url]&&markers[c.url].openPopup();
    card.onclick=()=>{if(c.coords){map.setView(c.coords,15);markers[c.url]&&markers[c.url].openPopup();}};

    if(c.coords){
      const mk=L.circleMarker(c.coords,{radius:9,color:"#fff",weight:2,
        fillColor:DCOLOR[c.district]||"#555",fillOpacity:c.contacted?0.4:0.95}).addTo(map);
      mk.bindPopup(`<div class="pop">${c.image?`<img src="/img?u=${encodeURIComponent(c.image)}">`:''}
        <div class="pp">€${c.price.toLocaleString()} · ${c.area}m²</div>
        <div>${c.title}</div><a href="${c.url}" target="_blank">View on Pararius ↗</a></div>`);
      mk.on("mouseover",()=>{const el=[...list.children].find(x=>x.dataset.url===c.url);if(el){el.classList.add("hi");el.scrollIntoView({block:"nearest",behavior:"smooth"});}});
      mk.on("mouseout",()=>{const el=[...list.children].find(x=>x.dataset.url===c.url);el&&el.classList.remove("hi");});
      markers[c.url]=mk;bounds.push(c.coords);
    }
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[40,40],maxZoom:15});
}

async function loadDetail(c,card){
  const box=card.querySelector(".detail");
  if(box.classList.contains("show")){box.classList.remove("show");return;}
  box.classList.add("show");box.innerHTML='<span class="spin" style="border-top-color:var(--accent);border-color:var(--line)"></span> loading details… (Pararius is slow right now, up to ~45s)';
  try{
    const r=await fetch("/api/detail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:c.url})});
    const d=await r.json();
    if(d.error){box.innerHTML=`⚠️ ${d.error}`;return;}
    const f=d.features||{};
    const keys=["Offered since","Available","Deposit","Interior","Number of rooms","Number of bedrooms","Rental agreement","Income requirement"];
    let rows=keys.filter(k=>f[k]).map(k=>`<b>${k}:</b> ${f[k]}`).join(" · ");
    box.innerHTML=(rows||"No structured fields found")+(d.description?`<br><br>${d.description.slice(0,320)}…`:"");
  }catch(e){box.innerHTML="failed to load details";}
}

let applyCtx=null;
function openApply(c){
  applyCtx=c;
  document.getElementById("mTitle").textContent="Apply — "+c.title;
  document.getElementById("mSub").textContent=`€${c.price}/mo · ${c.area}m² · ${c.district} · sends from your Pararius account`;
  document.getElementById("mMsg").value=DEFAULT_MSG;
  document.getElementById("modalBg").classList.add("show");
}
function closeApply(){document.getElementById("modalBg").classList.remove("show");applyCtx=null;}

async function sendApply(){
  if(!applyCtx)return;
  const btn=document.getElementById("mSend");
  const dry=document.getElementById("mDry").checked;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> sending…';
  try{
    const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:applyCtx.url,message:document.getElementById("mMsg").value,dry_run:dry})});
    const d=await r.json();
    if(d.ok){applyCtx.contacted=true;toast(`Applied (${d.kind}) ✓`);}
    else toast(dry?"Dry run done (nothing sent)":"Not sent: "+(d.error||"check the Chrome window / login"));
    closeApply();render();
  }catch(e){toast("Request failed");}
  finally{btn.disabled=false;btn.textContent="Send application";}
}

async function load(){
  const r=await fetch("/api/candidates");state.all=await r.json();render();
  // Deep link from an ntfy alert: /?apply=<listing url> opens its apply modal.
  const want=new URLSearchParams(location.search).get("apply");
  if(want){
    const c=state.all.find(x=>x.url===want);
    if(c&&!c.contacted){map.setView(c.coords||[51.92,4.47],15);openApply(c);}
    else if(c&&c.contacted)toast("Already applied to this one");
    else toast("That listing isn't in the current matches");
  }
}
async function doScrape(){
  const b=document.getElementById("scrape");b.disabled=true;b.innerHTML='<span class="spin"></span> scraping…';
  try{const r=await fetch("/api/scrape",{method:"POST"});const d=await r.json();
    if(d.candidates){state.all=d.candidates;render();toast(`Scrape done · ${d.added} new tracked`);}
    else toast(d.error||"scrape failed");
  }catch(e){toast("scrape failed");}
  finally{b.disabled=false;b.textContent="Scrape now";}
}

document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
  state.district=b.dataset.d;
  document.querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render();};
document.getElementById("scrape").onclick=doScrape;
document.getElementById("mCancel").onclick=closeApply;
document.getElementById("mSend").onclick=sendApply;
document.getElementById("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeApply();};

initMap();load();
</script>
</body>
</html>
